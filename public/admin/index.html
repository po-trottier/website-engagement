<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Dashboard — P-O &amp; Athena's Engagement Party</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1C5630;
      --accent: #f07a2b;
      --danger: #c0392b;
      --bg: #E7D8C6;
      --text: #1F2E27;
      --bg-light: #f0e8dc;
      --bp-mobile: 900px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    h1 {
      font-size: 2rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* ---------- Login ---------- */
    .login {
      max-width: 320px;
      margin: 4rem auto;
      text-align: center;
    }

    .login label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .login input {
      width: 100%;
      padding: 0.7rem;
      border: 1.5px solid rgba(28,86,48,0.3);
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .login input:focus { border-color: var(--primary); }

    .login .button { margin-top: 1rem; }

    .login-error {
      color: var(--accent);
      margin-top: 0.8rem;
      font-size: 0.9rem;
      display: none;
    }

    /* ---------- Dashboard ---------- */
    .dashboard { display: none; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--bg-light);
      padding: 1.2rem;
      text-align: center;
      border-radius: 4px;
    }

    .card-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 0.3rem;
    }

    /* ---------- Action bar ---------- */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
    }

    .action-bar-divider {
      width: 1px;
      height: 1.2rem;
      background: rgba(28,86,48,0.2);
      margin: 0 0.3rem;
    }

    .action-bar-count {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      opacity: 0.6;
    }

    .action-bar-spacer { width: 1em; flex-shrink: 0; }
    .action-bar-push { flex: 1; }

    /* ---------- Buttons ---------- */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.3s;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .button:hover { background: var(--primary); color: var(--bg); }

    .button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .button:disabled:hover {
      background: transparent;
      color: var(--primary);
    }

    .button-icon {
      padding: 0.4rem;
      line-height: 1;
      letter-spacing: 0;
      border: none;
    }

    .button-icon:hover {
      background: transparent;
      color: var(--accent);
    }

    .button-icon:disabled:hover {
      background: transparent;
      color: var(--primary);
    }


    .icon {
      width: 1.5rem;
      height: 1.5rem;
      vertical-align: -0.35rem;
      fill: currentColor;
    }

    .button-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .button-danger:hover { background: var(--danger); color: var(--bg); }

    .button-icon.button-danger {
      color: var(--danger);
    }

    .button-icon.button-danger:hover {
      background: transparent;
      color: var(--accent);
    }

    .button-icon.button-danger:disabled {
      color: var(--danger);
    }

    .button-icon.button-danger:disabled:hover {
      background: transparent;
      color: var(--danger);
    }

    /* ---------- Export popover ---------- */
    .export-wrap {
      position: relative;
    }

    .export-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.3rem;
      background: var(--bg);
      border: 1.5px solid rgba(28,86,48,0.2);
      box-shadow: 0 4px 12px rgba(28,86,48,0.08);
      z-index: 10;
      min-width: 140px;
    }

    .export-menu.open { display: flex; flex-direction: column; }

    .export-menu button {
      padding: 0.5rem 0.8rem;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }

    .export-menu button:hover { background: rgba(28,86,48,0.06); }

    /* ---------- Table ---------- */
    .table-wrap {
      overflow-x: auto;
      margin-bottom: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 0.6rem 0.8rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover { opacity: 0.7; }

    td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid rgba(28,86,48,0.1);
    }

    tr:hover td { background: rgba(28,86,48,0.03); }

    .select-col {
      width: 30px;
      text-align: center;
      vertical-align: middle;
      cursor: default;
    }

    .select-col:hover { opacity: 1; }

    .select-col input {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      vertical-align: middle;
    }

    .td-date {
      white-space: nowrap;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* ---------- Empty state ---------- */
    .empty-row td {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.9rem;
      opacity: 0.5;
    }

    /* ---------- Editable fields ---------- */
    .edit-field {
      width: 100%;
      padding: 0.3rem 0.4rem;
      border: 1px solid transparent;
      background: transparent;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .edit-field:focus {
      border-color: var(--primary);
      background: var(--bg-light);
    }

    .edit-field-small { width: 50px; text-align: center; }

    select.edit-field { cursor: pointer; }

    .edit-field.dirty {
      border-color: var(--accent);
    }

    .row-new td {
      background: rgba(240, 122, 43, 0.06);
    }

    /* ---------- Pagination ---------- */
    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-bottom: 2rem;
      font-size: 0.8rem;
    }

    .pagination button:not(.button-icon) {
      padding: 0.3rem 0.6rem;
      background: transparent;
      border: 1.5px solid rgba(28,86,48,0.2);
      color: var(--primary);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination button:hover { background: rgba(28,86,48,0.06); }
    .pagination button.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }
    .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pagination button:disabled:hover { background: transparent; }

    .pagination-ellipsis {
      padding: 0 0.3rem;
      opacity: 0.5;
    }

    .pagination-info {
      flex-basis: 100%;
      text-align: center;
      opacity: 0.5;
      margin-top: 0.3rem;
      font-size: 0.75rem;
    }

    /* ---------- Home link ---------- */
    .home-link {
      display: block;
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: underline;
      text-decoration-color: rgba(28,86,48,0.25);
    }

    .home-link:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    /* ---------- Mobile sort dropdown ---------- */
    .mobile-sort {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }

    .mobile-sort-count { display: none; }
    .card-toggle { display: none; }
    .card-glance { display: none; }

    .mobile-sort-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mobile-sort label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
    }

    .mobile-sort select {
      padding: 0.4rem 0.6rem;
      border: 1.5px solid rgba(28,86,48,0.3);
      background: transparent;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ---------- Mobile responsive ---------- */
    /* NOTE: CSS custom properties cannot be used in @media queries;
       keep this value in sync with --bp-mobile in :root */
    @media (max-width: 900px) {
      .mobile-sort { display: flex; }

      /* -- Summary cards: stacked list -- */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 0;
        background: var(--bg-light);
        border-radius: 4px;
        padding: 0.4rem 0.8rem;
        margin-bottom: 1.5rem;
      }

      .card {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0.5rem 0;
        background: transparent;
        border-radius: 0;
        border-bottom: 1px solid rgba(28,86,48,0.1);
        text-align: left;
      }

      .card:last-child {
        border-bottom: none;
      }

      .card-label {
        order: -1;
        font-size: 0.75rem;
        margin-top: 0;
      }

      .card-value {
        font-size: 1.3rem;
      }

      /* -- Action bar: larger touch targets, wrap -- */
      .action-bar {
        flex-wrap: wrap;
        gap: 0.2rem;
      }

      .button-icon {
        padding: 0.6rem 0.3rem;
      }

      .button-icon .icon {
        width: 1.3rem;
        height: 1.3rem;
      }

      .action-bar .button-icon:first-child {
        padding-left: 0;
      }

      .action-bar-spacer { display: none; }

      /* Hide selection count from action bar on mobile (shown in sort row instead) */
      .action-bar-divider { display: none; }
      .action-bar > .action-bar-count { display: none; }

      /* Sort row: count left, sort right */
      .mobile-sort { justify-content: space-between; }
      .mobile-sort-count { display: inline; }

      /* -- Table to cards -- */
      .table-wrap table thead { display: none; }

      .table-wrap table,
      .table-wrap table tbody {
        display: block;
        width: 100%;
      }

      .table-wrap { overflow-x: visible; }

      /* Empty state: single column, no grid */
      .table-wrap table tr.empty-row {
        display: block;
        padding: 2rem 1rem;
      }

      .table-wrap table tr.empty-row td {
        display: block;
        width: 100%;
        text-align: center;
        padding: 0;
      }

      /* Each row is a card using CSS grid: checkbox column + content column */
      .table-wrap table tr {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 0.5rem;
        grid-template-rows: auto;
        background: var(--bg-light);
        border-radius: 4px;
        padding: 0.8rem;
        margin-bottom: 0.8rem;
        border-left: 3px solid transparent;
      }

      .table-wrap table tr.row-dirty {
        border-left-color: var(--accent);
      }

      .table-wrap table tr.row-new {
        border-left-color: var(--accent);
      }

      .table-wrap table tr.row-new td {
        background: transparent;
      }

      .table-wrap table td {
        border-bottom: none;
        padding: 0.25rem 0;
      }

      .table-wrap table tr:hover td {
        background: transparent;
      }

      /* Checkbox: own column, spans all 7 rows (1 per data field + itself), vertically centered */
      .table-wrap table td.select-col {
        grid-column: 1;
        grid-row: 1 / span 7;
        display: flex;
        align-items: center;
        justify-content: center;
        width: auto;
        padding: 0 0.4rem;
      }

      /* All data cells go in column 2 */
      .table-wrap table td[data-label] {
        grid-column: 2;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .table-wrap table td[data-label]::before {
        content: attr(data-label);
        display: inline-block;
        width: 5.5rem;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary);
        opacity: 0.7;
        vertical-align: middle;
        flex-shrink: 0;
      }

      /* Name: prominent, with label like other fields */
      .table-wrap table td[data-label="Name"] {
        padding-bottom: 0.4rem;
      }

      /* Collapsed: hide the "NAME" label, let input size to content */
      .table-wrap table td[data-label="Name"]::before {
        display: none;
      }

      .table-wrap table tr.card-open td[data-label="Name"]::before {
        display: inline-block;
      }

      .table-wrap table tr.card-open td[data-label="Name"] {
        margin-bottom: 0.3rem;
        border-bottom: 1px solid rgba(28,86,48,0.08);
      }

      .table-wrap table td[data-label] .edit-field {
        flex: 1;
        min-width: 0;
        text-align: left;
      }

      .table-wrap table td[data-label="Name"] .edit-field {
        font-size: 1rem;
        font-weight: 600;
        field-sizing: content;
        flex: 0 1 auto;
      }

      .table-wrap table tr.card-open td[data-label="Name"] .edit-field {
        field-sizing: fixed;
        flex: 1;
      }

      /* Fix select alignment to match input fields */
      .table-wrap table td[data-label] select.edit-field {
        padding-left: 0.25rem;
        margin-left: -0.05rem;
      }

      /* -- Collapsible card details -- */
      .table-wrap table td.card-detail {
        display: none;
      }

      .table-wrap table tr.card-open td.card-detail {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      /* Chevron toggle on name row */
      .card-toggle {
        display: inline-flex;
        align-items: center;
        margin-left: auto;
        padding: 0 0.2rem;
        flex-shrink: 0;
        opacity: 0.4;
        transition: transform 0.2s;
        cursor: pointer;
      }

      .card-toggle .icon {
        width: 1rem;
        height: 1rem;
      }

      .table-wrap table tr.card-open .card-toggle {
        transform: rotate(180deg);
      }

      /* At-a-glance indicators */
      .card-glance {
        display: inline-flex;
        flex-shrink: 0;
        font-weight: 400;
        font-size: 0.8rem;
      }

      .glance-yes { color: var(--primary); }
      .glance-no { color: var(--danger); }
      .glance-plus { opacity: 0.5; margin-left: 0.3rem; }

      .table-wrap table tr.card-open .card-glance {
        display: none;
      }

      /* Checkbox spans only 1 row when collapsed */
      .table-wrap table td.select-col {
        grid-row: 1 / span 1;
        align-items: center;
      }

      .table-wrap table tr.card-open td.select-col {
        grid-row: 1 / span 7;
      }

      .table-wrap table .td-date {
        font-size: 0.75rem;
        opacity: 0.5;
      }
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; align-items:center; margin-bottom:2rem;">
      <a href="/" class="button button-icon" title="Back to Home" style="text-decoration:none; margin-right:1rem;"><svg class="icon" viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg></a>
      <h1 style="margin:0; flex:1; text-align:center;">RSVP Dashboard</h1>
      <button class="button button-icon" id="logout-btn" title="Logout" style="display:none; margin-left:1rem;"><svg class="icon" viewBox="0 0 24 24"><path d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z"/></svg></button>
    </div>

    <!-- Login -->
    <div class="login" id="login">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter admin password" autofocus>
      <button class="button" id="login-btn">View RSVPs</button>
      <p class="login-error" id="login-error">Invalid password. Please try again.</p>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <div class="cards" id="cards"></div>

      <div class="action-bar">
        <button class="button button-icon" id="add-btn" title="Add guest"><svg class="icon" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg></button>
        <button class="button button-icon button-danger" id="batch-delete-btn" disabled title="Delete selected"><svg class="icon" viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg></button>
        <span class="action-bar-spacer"></span>
        <button class="button button-icon" id="save-btn" disabled title="Save changes"><svg class="icon" viewBox="0 0 24 24"><path d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z"/></svg></button>
        <span class="action-bar-spacer"></span>
        <button class="button button-icon" id="batch-email-btn" disabled title="Send email to selected"><svg class="icon" viewBox="0 0 24 24"><path d="M20,8L12,13L4,8V6L12,11L20,6M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z"/></svg></button>
        <span class="action-bar-divider"></span>
        <span class="action-bar-count"><span id="batch-count">0</span> selected</span>
        <span class="action-bar-push"></span>
        <div class="export-wrap">
          <button class="button" id="export-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M23,12L19,8V11H10V13H19V16M1,18V6C1,4.89 1.9,4 3,4H15A2,2 0 0,1 17,6V9H15V6H3V18H15V15H17V18A2,2 0 0,1 15,20H3A2,2 0 0,1 1,18Z"/></svg> Export</button>
          <div class="export-menu" id="export-menu">
            <button id="export-csv"><svg class="icon" viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg> CSV</button>
          </div>
        </div>
      </div>

      <div class="mobile-sort" id="mobile-sort">
        <span class="mobile-sort-count action-bar-count"><span id="mobile-batch-count">0</span> selected</span>
        <span class="mobile-sort-controls">
          <label for="mobile-sort-select">Sort by</label>
          <select id="mobile-sort-select">
            <option value="createdAt-desc">Date (newest)</option>
            <option value="createdAt-asc">Date (oldest)</option>
            <option value="name-asc">Name (A–Z)</option>
            <option value="name-desc">Name (Z–A)</option>
            <option value="attending-desc">Attending first</option>
            <option value="attending-asc">Declined first</option>
          </select>
        </span>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>

    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
